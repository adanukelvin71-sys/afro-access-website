<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Afro Access GH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main page-hero">
        <div class="navbar">
            <div class="icon">
                <img src="afroaccesslogo.jpg" alt="Afro Access GH   logo" class="logo">
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="services.html">SERVICES</a></li>
                    <li><a href="contact.html" class="active">CONTACT</a></li>
                    <li><a href="profile.html">PROFILE</a></li>
                </ul>
            </nav>
            <form class="search" action="#" role="search">
                <input class="srch" type="search" name="q" placeholder="Type To Text">
                <button class="btn" type="submit">Search</button>
            </form>
        </div>
        <h1 class="page-title">Contact Us</h1>
    </header>

    <main class="page">
        <div class="contact-wrap">
            <section>
                <h2>Send us a message</h2>
                <!-- NOTE: this form needs a backend or a form service (e.g. Formspree) to actually send messages. -->
                <form class="contact-form" action="#" method="post">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" required>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" required>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                    <button type="submit">Send message</button>
                </form>
            </section>
            <section class="contact-details">
                <h2>Reach us directly</h2>
                <!-- EDIT: put your real details here. For WhatsApp use the format 233XXXXXXXXX (no + or leading 0). -->
                <p>Phone: 0538147591</p>
                <p>Email: info@afroaccessgh.com</p>
                <p>Location: Accra, Ghana</p>
                <a class="whatsapp" href="https://wa.me/233538147591" target="_blank" rel="noopener">Chat on WhatsApp</a>
            </section>
        </div>
    </main>

    <footer class="footer">&copy; 2026 Afro Access GH. All rights reserved.</footer>
</body>
</html>
